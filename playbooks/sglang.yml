---
# SGLang container for the MoE model (Qwen3.6-35B-A3B). Created but NOT started: the llm-gateway
# (playbooks/llm-gateway.yml) starts it on demand and stops the other inference container
# (vllm-dense, playbooks/vllm.yml), because each claims both 3090s (TP=2).
# Not published on a host port; the gateway reaches it at http://sglang:30000 over homelab-net.
#
# The dense Qwen3.6-27B-AWQ produces "!" spam on SGLang (vars/sglang-qwen3-dense.yml); it runs on vLLM.
#
# Model options (override with -e or -e @vars/<file>.yml):
#   Qwen3.6-35B: sglang_model_id=Qwen/Qwen3.6-35B-A3B-AWQ   sglang_served_model_name=qwen3.6-35b-a3b  sglang_image=lmsysorg/sglang:latest
#   Gemma 4 27B: sglang_model_id=cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit  sglang_served_model_name=gemma4-27b  sglang_image=lmsysorg/sglang:gemma4
# A different served name needs a matching entry in llm_models (playbooks/llm-gateway.yml).
#
# VRAM budget (2× RTX 3090, 24 GB each, TP=2): see docs/inference-config-summary.md.

- name: Deploy SGLang GPU container
  hosts: homelab
  gather_facts: no

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net

    sglang_image: "sglang-base:working"
    sglang_model_id: "QuantTrio/Qwen3.6-35B-A3B-AWQ"
    sglang_served_model_name: "qwen3.6-35b-a3b"
    sglang_tensor_parallel_size: 2
    sglang_max_model_len: 131072
    sglang_gpu_memory_fraction: "0.88"
    sglang_extra_args: >-
      --chunked-prefill-size 8192
      --max-running-requests 8
      --attention-backend flashinfer
      --mamba-scheduler-strategy no_buffer
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
    sglang_awq_patch: true
    sglang_json_model_override_args: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}}'

  tasks:

    - name: Create SGLang compose directory
      ansible.builtin.file:
        path: "{{ compose_base }}/sglang"
        state: directory
        mode: '0755'
      become: yes
      tags: [install, sglang]

    - name: Deploy SGLang compose file from template
      ansible.builtin.template:
        src: ../templates/sglang-compose.yml.j2
        dest: "{{ compose_base }}/sglang/docker-compose.yml"
        mode: '0644'
      become: yes
      tags: [configure, sglang]

    - name: Ensure SGLang image is present
      community.docker.docker_image:
        name: "{{ sglang_image }}"
        source: local
      become: yes
      tags: [docker, sglang]

    - name: Stop and remove SGLang container to apply new config (no port binding)
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_base }}/sglang/docker-compose.yml rm -sf sglang
      become: yes
      ignore_errors: yes  # ok if container doesn't exist
      tags: [docker, sglang]

    - name: Pre-create SGLang container from new config (llm-gateway starts it on demand)
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_base }}/sglang/docker-compose.yml create sglang
      become: yes
      register: sglang_create
      changed_when: "'Created' in sglang_create.stdout or 'Created' in sglang_create.stderr"
      tags: [docker, sglang]
