---
# CockroachDB major-version upgrade helper (single-node, insecure, Docker).
#
# Flow (image tag itself is bumped via `cockroachdb_version` in playbooks/docker.yml):
#   1. ansible-playbook playbooks/cockroachdb-upgrade.yml --tags prepare
#        -> holds auto-finalization so the upgrade stays reversible
#   2. bump cockroachdb_version in docker.yml and apply
#        ansible-playbook playbooks/docker.yml --tags configure,service
#   3. validate Datomic etc., then finalize (irreversible):
#        ansible-playbook playbooks/cockroachdb-upgrade.yml --tags finalize
#
# `finalize` is tagged `never` so it only runs when asked for explicitly.

- name: CockroachDB upgrade helper
  hosts: homelab
  gather_facts: no

  vars:
    crdb_previous_major: "26.1"
    # CSV output is a header line plus a value line that is blank when unset
    crdb_pdo_value: >-
      {{ crdb_pdo.stdout_lines | reject('equalto', 'cluster.preserve_downgrade_option')
         | map('trim') | list | last | default('') }}

  tasks:
    - name: Read current preserve_downgrade_option
      ansible.builtin.command: >
        docker exec cockroachdb cockroach sql --insecure --format=csv
        -e "SHOW CLUSTER SETTING cluster.preserve_downgrade_option"
      register: crdb_pdo
      changed_when: false
      check_mode: no
      become: yes
      tags: [prepare, finalize, upgrade]

    - name: Hold auto-finalization at the current major version
      ansible.builtin.command: >
        docker exec cockroachdb cockroach sql --insecure
        -e "SET CLUSTER SETTING cluster.preserve_downgrade_option = '{{ crdb_previous_major }}'"
      when: crdb_pdo_value | trim != crdb_previous_major
      become: yes
      tags: [prepare, upgrade]

    - name: Finalize the major-version upgrade (IRREVERSIBLE)
      ansible.builtin.command: >
        docker exec cockroachdb cockroach sql --insecure
        -e "RESET CLUSTER SETTING cluster.preserve_downgrade_option"
      when: crdb_pdo_value | trim != ''
      become: yes
      tags: [finalize, never]
