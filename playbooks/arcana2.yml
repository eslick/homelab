---
# Arcana 2 live-dev runtime (replaces Arcana v1; see runbooks and
# ~/projects/arcana2/docs/handoff/homelab-arcana2.md).
#
# Source of truth is the git checkout at arcana2_src_path, bind-mounted into the
# containers for live reload. The two-node cluster is defined by docker/compose.dev.yml in that
# checkout (the same file `make dev.up` uses); this playbook runs that file rather than a
# template copy, so the two cannot drift. Exception to the /opt/compose convention, deliberate:
# the compose file is owned by the Arcana repo. This playbook manages what is outside it: the
# provider env file, ARCANA_BIND_IP in docker/dev.env, the database, and the lifecycle.
#
# Usage:
#   ansible-playbook playbooks/arcana2.yml --check --diff
#   ansible-playbook playbooks/arcana2.yml
#   ansible-playbook playbooks/arcana2.yml -e arcana2_rebuild=true   # after Dockerfile.dev / mix.exs changes

- name: Manage Arcana 2 runtime
  hosts: homelab
  gather_facts: no
  vars_files:
    - ../vars/browser-service.yml

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net
    secrets_path: /opt/secrets
    arcana2_src_path: /home/eslick/projects/arcana2
    arcana2_port: 4100
    arcana2_db: arcana_dev
    arcana2_compose_dir: "{{ arcana2_src_path }}/docker"
    arcana2_bind_ip: 100.74.60.51    # tailnet IP the consoles also publish on (never all interfaces)
    anthropic_api_key: "{{ vault_anthropic_api_key }}"
    arcana2_rebuild: false

    # Provider secrets written to {{ secrets_path }}/arcana2.env as ENV_NAME=value (blank values are skipped).
    # Sources are vault variables in group_vars/all.yml; `default('')` makes a key optional, so adding a
    # missing one later is a one-line vault change plus `--tags secrets`. See docs/arcana-overview-contract.md
    # neighbours and runbooks/2026-10-04-arcana-provider-secrets.md.
    arcana2_provider_secrets:
      ANTHROPIC_API_KEY: "{{ anthropic_api_key }}"          # required
      OPENAI_API_KEY: "{{ vault_openai_api_key | default('') }}"
      TOGETHER_API_KEY: "{{ together_ai_api_key | default('') }}"
      HF_TOKEN: "{{ hugging_face_token | default('') }}"
      PERPLEXITY_API_KEY: "{{ vault_perplexity_api_key | default('') }}"
      GOOGLE_CLIENT_ID: "{{ vault_google_client_id | default('') }}"   # not secret; kept with its pair
      GOOGLE_CLIENT_SECRET: "{{ vault_google_client_secret | default('') }}"
      DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token | default('') }}"
      TELEGRAM_BOT_TOKEN: "{{ vault_telegram_bot_token | default('') }}"
      BROWSER_SERVICE_TOKEN: "{{ browser_service_token }}"        # see docs/handoff/homelab-browser-service.md in the arcana2 repo
      BROWSER_SERVICE_URL: "{{ browser_service_url_internal }}"   # not secret; kept here so compose.dev.yml's env_file delivers it
      FLUXON_LICENSE_KEY: "{{ vault_fluxon_license_key | default('') }}"
      VOYAGE_API_KEY: "{{ vault_voyage_api_key | default('') }}"       # not yet created
      GEMINI_API_KEY: "{{ vault_gemini_api_key | default('') }}"       # not yet created
      BRAVE_API_KEY: "{{ vault_brave_api_key | default('') }}"         # not yet created
      GOOGLE_API_KEY: "{{ vault_google_api_key | default('') }}"       # not yet created

    # The arcana2 repo's compose (docker/compose.dev.yml, run by `make dev.up` as this user) reads the
    # file client-side, so it must be readable by the operator. The operator already has docker access
    # (root-equivalent), so this does not widen exposure; mode stays 0600.
    arcana2_env_owner: eslick

  tasks:
    # The directory is shared with other services and owned by eslick; leave its
    # ownership/mode alone and protect only the file we put in it.
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ secrets_path }}"
        state: directory
      become: yes
      tags: [docker, configure, security, secrets]

    - name: Deploy arcana2 provider secrets env file (0600, blanks skipped)
      ansible.builtin.copy:
        dest: "{{ secrets_path }}/arcana2.env"
        owner: "{{ arcana2_env_owner }}"
        group: "{{ arcana2_env_owner }}"
        mode: '0600'
        content: "{% for i in arcana2_provider_secrets | dict2items if (i.value | string | trim) != '' %}{{ i.key }}={{ i.value }}\n{% endfor %}"
      no_log: true
      become: yes
      tags: [docker, configure, security, secrets]

    - name: Remove the retired generated compose copy (the repo's docker/compose.dev.yml is used instead)
      ansible.builtin.file:
        path: "{{ compose_base }}/arcana2/docker-compose.yml"
        state: absent
      become: yes
      tags: [docker, configure]

    - name: Ensure ARCANA_BIND_IP is set in docker/dev.env (other lines, e.g. VAPID keys, are kept)
      ansible.builtin.lineinfile:
        path: "{{ arcana2_compose_dir }}/dev.env"
        regexp: '^ARCANA_BIND_IP='
        line: "ARCANA_BIND_IP={{ arcana2_bind_ip }}"
        create: yes
        mode: '0600'
      tags: [docker, configure]

    - name: List YugabyteDB databases
      ansible.builtin.command: >
        docker exec yugabytedb
        ysqlsh -h yugabytedb -U yugabyte -tAc "SELECT datname FROM pg_database"
      register: arcana2_dbs
      changed_when: false
      check_mode: no
      become: yes
      tags: [docker]

    - name: Create the arcana_dev database in YugabyteDB
      ansible.builtin.command: >
        docker exec yugabytedb
        ysqlsh -h yugabytedb -U yugabyte -c "CREATE DATABASE {{ arcana2_db }}"
      when: arcana2_db not in arcana2_dbs.stdout_lines
      become: yes
      tags: [docker]

    - name: Build and start the Arcana 2 cluster from the repo compose file
      community.docker.docker_compose_v2:
        project_src: "{{ arcana2_compose_dir }}"
        files: [compose.dev.yml]
        env_files: ["{{ arcana2_compose_dir }}/dev.env"]
        project_name: arcana-dev
        state: present
        build: "{{ 'always' if arcana2_rebuild | bool else 'policy' }}"
      tags: [docker, service]

    - name: Wait for the Arcana 2 admin console to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ arcana2_port }}/"
        status_code: [200, 301, 302, 303]
        timeout: 5
      register: arcana2_health
      until: arcana2_health.status in [200, 301, 302, 303]
      retries: 24
      delay: 5
      when: not ansible_check_mode
      tags: [docker, service]

    - name: Wait for the follower node's console
      ansible.builtin.uri:
        url: "http://127.0.0.1:4101/"
        status_code: [200, 301, 302, 303]
        timeout: 5
      register: arcana2_follower_health
      until: arcana2_follower_health.status in [200, 301, 302, 303]
      retries: 24
      delay: 5
      when: not ansible_check_mode
      tags: [docker, service]
