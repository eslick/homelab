---
# Owns the Obsidian vault (/opt/vaults/obsidian): Syncthing syncs it between speedracer and
# the MacBook over Tailscale. Also retires the old CouchDB/LiveSync sync services.
#
# Manual pairing (Ansible cannot do this; also in README "Full rebuild"):
#   1. Get Linux device ID:  syncthing --device-id (or see web UI)
#   2. On Mac: install Tailscale, then brew install syncthing && brew services start syncthing
#   3. Open Mac Syncthing UI at http://127.0.0.1:8384
#   4. Add remote device using Linux device ID (address tcp://speedracer.terrier-haddock.ts.net:22000)
#   5. Share the vault folder to the Linux device (Mac folder Send Only until first sync is done
#      if the Mac vault is the source of truth)
#   6. On Linux web UI (http://127.0.0.1:8384 via SSH tunnel): accept folder, path /opt/vaults/obsidian
#   7. Server .stignore is deployed below; create the same file by hand in the Mac vault (see README)
#
# SSH tunnel to Linux web UI:
#   ssh -L 8385:127.0.0.1:8384 speedracer.terrier-haddock.ts.net
#   then open http://127.0.0.1:8385
#
# Usage:
#   ansible-playbook playbooks/syncthing.yml --check --diff
#   ansible-playbook playbooks/syncthing.yml

- name: Install and configure Syncthing
  hosts: homelab
  gather_facts: yes

  vars:
    vault_path: /opt/vaults/obsidian
    syncthing_user: eslick
    syncthing_config_dir: /home/eslick/.local/share/syncthing

  tasks:

    - name: Add Syncthing apt signing key
      ansible.builtin.get_url:
        url: https://syncthing.net/release-key.gpg
        dest: /usr/share/keyrings/syncthing-archive-keyring.gpg
        mode: '0644'
      become: yes
      tags: [install]

    - name: Add Syncthing apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable"
        state: present
        filename: syncthing
      become: yes
      tags: [install]

    - name: Install syncthing
      ansible.builtin.apt:
        name: syncthing
        state: present
        update_cache: yes
      become: yes
      tags: [install]

    - name: Ensure vault directory is owned by syncthing user
      ansible.builtin.file:
        path: "{{ vault_path }}"
        state: directory
        owner: "{{ syncthing_user }}"
        group: "{{ syncthing_user }}"
        mode: 'u=rwX,g=rX,o=rX'   # X: dirs stay traversable, notes are not made executable
        recurse: yes
      become: yes
      tags: [configure]

    - name: Deploy vault .stignore (Obsidian UI state and OS junk; not synced between devices)
      ansible.builtin.copy:
        dest: "{{ vault_path }}/.stignore"
        owner: "{{ syncthing_user }}"
        group: "{{ syncthing_user }}"
        mode: '0644'
        content: |
          // Managed by Ansible (playbooks/syncthing.yml). .stignore is per-device: the Mac has its own copy.
          // Obsidian UI state: rewritten constantly, differs per device
          .obsidian/workspace.json
          .obsidian/workspace-mobile.json
          .obsidian/cache

          // OS junk; (?d) lets Syncthing delete it if it blocks removing a folder
          (?d).DS_Store
          (?d)Thumbs.db
          (?d).Trash-*

          // Syncthing's own temp files
          *.tmp
          ~syncthing~*
      become: yes
      tags: [configure]

    - name: Enable and start syncthing service for user
      ansible.builtin.systemd:
        name: "syncthing@{{ syncthing_user }}"
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes
      when: not ansible_check_mode
      tags: [service]

    - name: Allow Syncthing sync port through UFW (Tailscale interface only)
      ansible.builtin.ufw:
        rule: allow
        port: "22000"
        proto: any
        interface: tailscale0
        direction: in
      become: yes
      tags: [security]

    - name: Print device ID and next steps
      ansible.builtin.command: syncthing --device-id
      register: device_id
      changed_when: false
      become: yes
      become_user: "{{ syncthing_user }}"
      tags: [configure]

    - name: Show device ID
      ansible.builtin.debug:
        msg: |
          Syncthing is running.
          Linux device ID: {{ device_id.stdout }}
          Web UI (via SSH tunnel): ssh -L 8385:127.0.0.1:8384 speedracer.terrier-haddock.ts.net
          Then open: http://127.0.0.1:8385
      tags: [configure]

    # --- Retired: Obsidian LiveSync (CouchDB) sync, replaced by Syncthing ---
    # The CouchDB container, its volume and compose dir were deleted 2026-10-12 (user-approved;
    # restic snapshot of 2026-10-12 03:00 still holds the volume).
    # The vault itself (/opt/vaults/obsidian) is now owned by Syncthing; never remove it.

    - name: Stop and disable retired LiveSync services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - obsidian-vault-writeback
        - obsidian-sync
      become: yes
      failed_when: false
      when: not ansible_check_mode
      tags: [service, retire]

    - name: Remove retired LiveSync cron job
      ansible.builtin.cron:
        name: obsidian-vault-full-sync
        user: root
        state: absent
      become: yes
      tags: [cron, retire]

    - name: Remove retired LiveSync units and scripts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/obsidian-sync.service
        - /etc/systemd/system/obsidian-vault-writeback.service
        - /opt/scripts/obsidian-sync.py
        - /opt/scripts/obsidian-sync.service
        - /opt/scripts/obsidian-vault-writeback.service
        - /opt/obsidian
      become: yes
      register: livesync_units
      tags: [configure, retire]

    - name: Reload systemd after removing LiveSync units
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes
      when: livesync_units is changed and not ansible_check_mode
      tags: [service, retire]

    - name: Check for retired CouchDB compose project
      ansible.builtin.stat:
        path: /opt/compose/obsidian-couchdb/docker-compose.yml
      register: couchdb_compose
      become: yes
      tags: [docker, retire]

    - name: Remove retired CouchDB container and volume
      community.docker.docker_compose_v2:
        project_src: /opt/compose/obsidian-couchdb
        state: absent
        remove_volumes: yes
      become: yes
      when: couchdb_compose.stat.exists
      tags: [docker, retire]

    - name: Remove retired CouchDB compose directory
      ansible.builtin.file:
        path: /opt/compose/obsidian-couchdb
        state: absent
      become: yes
      tags: [configure, retire]
