---
- name: Configure nginx HTTPS reverse proxy via Tailscale TLS
  hosts: homelab
  gather_facts: yes

  vars:
    tailscale_hostname: speedracer.terrier-haddock.ts.net
    tailscale_ip: "{{ ansible_tailscale0.ipv4.address }}"
    cert_dir: /etc/ssl/tailscale
    arcana2_port: 4100            # 127.0.0.1-bound container port (playbooks/arcana2.yml)
    arcana2_nginx_port: 14000     # Tailscale TLS port (same URL Arcana v1 used)
    vllm_port: 8081
    vllm_nginx_port: 8082
    homeassistant_port: 8123
    homeassistant_nginx_port: 8124

    minio_api_port: 9000          # 127.0.0.1-bound S3 API
    minio_api_nginx_port: 9000    # tailnet TLS port (different IP than the loopback bind, same number)
    minio_console_port: 9001
    minio_console_nginx_port: 9002
    yugabytedb_ui_port: 7000
    yugabytedb_ui_nginx_port: 7001
    yugabytedb_enabled: true    # keep in sync with playbooks/docker.yml

    index_web_root: /var/www/tailscale-index

    # Overview dashboard (templates/homelab-overview.html.j2). Arcana's own details
    # come from fragment files in its repo; see docs/arcana-overview-contract.md.
    arcana2_src_path: /home/eslick/projects/arcana2
    arcana_overview_dir: "{{ arcana2_src_path }}/docs/homelab"
    overview_snapshot_date: "2026-10-04"
    overview_arcana_ref: "2026-10-04 · branch model-store-query-atoms @ 7c1f6b55"
    tailscale_services:
      - name: Arcana 2
        port: "{{ arcana2_nginx_port }}"
        description: Arcana 2 live-dev node (admin console)
        detail_url: /arcana.html
      - name: Home Assistant
        port: "{{ homeassistant_nginx_port }}"
        description: Home automation
      - name: vLLM / SGLang inference
        port: "{{ vllm_nginx_port }}"
        description: OpenAI-compatible LLM API (lazy-loaded GPU backend)
      - name: MinIO Console
        port: "{{ minio_console_nginx_port }}"
        description: S3-compatible object storage
      - name: YugabyteDB Admin UI
        port: "{{ yugabytedb_ui_nginx_port }}"
        description: Arcana's backend database

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      become: yes
      tags: [install]

    - name: Create Tailscale cert directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: '0750'
        owner: root
        group: www-data
      become: yes
      tags: [configure, tls]

    - name: Obtain Tailscale TLS certificate
      ansible.builtin.command:
        cmd: >
          tailscale cert
          --cert-file {{ cert_dir }}/speedracer.crt
          --key-file {{ cert_dir }}/speedracer.key
          {{ tailscale_hostname }}
      become: yes
      changed_when: false
      tags: [configure, tls]

    - name: Set cert file permissions readable by nginx
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: www-data
        mode: '0640'
      loop:
        - "{{ cert_dir }}/speedracer.crt"
        - "{{ cert_dir }}/speedracer.key"
      become: yes
      when: not ansible_check_mode
      tags: [configure, tls]

    - name: Remove OpenClaw nginx site (decommissioned)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/openclaw
        - /etc/nginx/sites-available/openclaw
      become: yes
      notify: Reload nginx
      tags: [configure]

    - name: Deploy nginx site config for Arcana 2
      ansible.builtin.template:
        src: ../templates/arcana2-nginx.conf.j2
        dest: /etc/nginx/sites-available/arcana2
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, arcana2]

    - name: Enable nginx site for Arcana 2
      ansible.builtin.file:
        src: /etc/nginx/sites-available/arcana2
        dest: /etc/nginx/sites-enabled/arcana2
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, arcana2]

    - name: Remove retired Arcana v1 nginx site
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/arcana
        - /etc/nginx/sites-available/arcana
        - /etc/nginx/sites-enabled/agentos     # pre-rename v1 site; also claimed :14000
        - /etc/nginx/sites-available/agentos
      become: yes
      notify: Reload nginx
      tags: [configure, arcana2]

    - name: Deploy nginx site config for vLLM
      ansible.builtin.template:
        src: ../templates/vllm-nginx.conf.j2
        dest: /etc/nginx/sites-available/vllm
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, vllm]

    - name: Enable nginx site for vLLM
      ansible.builtin.file:
        src: /etc/nginx/sites-available/vllm
        dest: /etc/nginx/sites-enabled/vllm
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, vllm]

    - name: Deploy nginx site config for Home Assistant
      ansible.builtin.template:
        src: ../templates/homeassistant-nginx.conf.j2
        dest: /etc/nginx/sites-available/homeassistant
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, homeassistant]

    - name: Enable nginx site for Home Assistant
      ansible.builtin.file:
        src: /etc/nginx/sites-available/homeassistant
        dest: /etc/nginx/sites-enabled/homeassistant
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, homeassistant]

    - name: Deploy nginx site config for MinIO console
      ansible.builtin.template:
        src: ../templates/minio-nginx.conf.j2
        dest: /etc/nginx/sites-available/minio
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, minio]

    - name: Enable nginx site for MinIO console
      ansible.builtin.file:
        src: /etc/nginx/sites-available/minio
        dest: /etc/nginx/sites-enabled/minio
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, minio]

    - name: Deploy nginx site config for MinIO S3 API
      ansible.builtin.template:
        src: ../templates/minio-api-nginx.conf.j2
        dest: /etc/nginx/sites-available/minio-api
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, minio]

    - name: Enable nginx site for MinIO S3 API
      ansible.builtin.file:
        src: /etc/nginx/sites-available/minio-api
        dest: /etc/nginx/sites-enabled/minio-api
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, minio]

    - name: Deploy nginx site config for YugabyteDB admin UI
      ansible.builtin.template:
        src: ../templates/yugabytedb-nginx.conf.j2
        dest: /etc/nginx/sites-available/yugabytedb
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, yugabytedb]

    - name: Enable nginx site for YugabyteDB admin UI
      ansible.builtin.file:
        src: /etc/nginx/sites-available/yugabytedb
        dest: /etc/nginx/sites-enabled/yugabytedb
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, yugabytedb]

    - name: Ensure Tailscale services index web root exists
      ansible.builtin.file:
        path: "{{ index_web_root }}"
        state: directory
        mode: '0755'
      become: yes
      tags: [configure, index]

    - name: Deploy Tailscale services index page
      ansible.builtin.template:
        src: ../templates/tailscale-index.html.j2
        dest: "{{ index_web_root }}/index.html"
        mode: '0644'
      become: yes
      tags: [configure, index]

    - name: Deploy homelab overview dashboard page
      ansible.builtin.template:
        src: ../templates/homelab-overview.html.j2
        dest: "{{ index_web_root }}/overview.html"
        mode: '0644'
      become: yes
      tags: [configure, index, overview]

    - name: Deploy Arcana 2 sub-page
      ansible.builtin.template:
        src: ../templates/arcana-overview.html.j2
        dest: "{{ index_web_root }}/arcana.html"
        mode: '0644'
      become: yes
      tags: [configure, index, overview]

    - name: Publish the Arcana overview contribution instructions
      ansible.builtin.copy:
        src: ../docs/arcana-overview-contract.md
        dest: "{{ index_web_root }}/arcana-overview-contract.txt"
        mode: '0644'
      become: yes
      tags: [configure, index, overview]

    - name: Deploy nginx site config for Tailscale services index
      ansible.builtin.template:
        src: ../templates/tailscale-index-nginx.conf.j2
        dest: /etc/nginx/sites-available/tailscale-index
        mode: '0644'
      become: yes
      notify: Reload nginx
      tags: [configure, index]

    - name: Enable nginx site for Tailscale services index
      ansible.builtin.file:
        src: /etc/nginx/sites-available/tailscale-index
        dest: /etc/nginx/sites-enabled/tailscale-index
        state: link
      become: yes
      notify: Reload nginx
      when: not ansible_check_mode
      tags: [configure, index]

    - name: Allow the services index ports (HTTP redirect + HTTPS) through UFW on Tailscale interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        port: '{{ item }}'
        proto: tcp
      loop:
        - '80'
        - '443'
      become: yes
      tags: [security, index]

    - name: Remove Obsidian CouchDB nginx site (decommissioned)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/obsidian
        - /etc/nginx/sites-available/obsidian
      become: yes
      notify: Reload nginx
      tags: [configure]

    - name: Disable nginx default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: yes
      notify: Reload nginx
      tags: [configure]

    - name: Create nginx systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        mode: '0755'
      become: yes
      tags: [service]

    - name: Deploy nginx drop-in to start after Tailscale
      ansible.builtin.copy:
        dest: /etc/systemd/system/nginx.service.d/after-tailscale.conf
        mode: '0644'
        content: |
          [Unit]
          After=tailscaled.service
          Wants=tailscaled.service

          [Service]
          Restart=on-failure
          RestartSec=5s
      become: yes
      notify:
        - Reload systemd
        - Restart nginx
      tags: [service]

    - name: Ensure nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
      become: yes
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [service]

    - name: Allow nginx ports through UFW on Tailscale interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        port: '{{ item }}'
        proto: tcp
      loop:
        - '2099'
        - '{{ arcana2_nginx_port }}'
        - '{{ vllm_nginx_port }}'
        - '{{ homeassistant_nginx_port }}'
        - '{{ minio_console_nginx_port }}'
        - '{{ minio_api_nginx_port }}'
      become: yes
      tags: [security, homeassistant, minio, yugabytedb]

    # Allowed only while YugabyteDB is enabled; removed when it is disabled.
    - name: Manage UFW rule for the YugabyteDB UI vhost on Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        port: '{{ yugabytedb_ui_nginx_port }}'
        proto: tcp
        delete: "{{ not (yugabytedb_enabled | bool) }}"
      become: yes
      tags: [security, yugabytedb]

    - name: Schedule weekly Tailscale cert renewal
      ansible.builtin.cron:
        name: tailscale-cert-renew
        job: >-
          tailscale cert
          --cert-file {{ cert_dir }}/speedracer.crt
          --key-file {{ cert_dir }}/speedracer.key
          {{ tailscale_hostname }}
          > /dev/null
          && systemctl reload nginx
        weekday: '0'
        hour: '3'
        minute: '0'
        user: root
      become: yes
      tags: [configure, cron]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes

    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      become: yes

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: yes
