# Deploys Home Assistant Core (host networking) for on-boot home automation.
#
# network_mode: host is an approved exception to the usual 127.0.0.1-bound /
# homelab-net convention — see templates/homeassistant-compose.yml.j2 for why.
#
# Zigbee2MQTT/Mosquitto are intentionally not included yet — no Zigbee USB
# coordinator is attached. Add them as a separate play once hardware arrives;
# they belong on {{ docker_network }} like the rest of the stack, not on
# host networking.
#
# Apply:
#   ansible-playbook playbooks/homeassistant.yml --check --diff
#   ansible-playbook playbooks/homeassistant.yml

- name: Deploy Home Assistant
  hosts: homelab
  gather_facts: no

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net
    docker_bridge_gateway: 172.18.0.1  # homelab-net gateway; other containers reach HA here

    homeassistant_image: "ghcr.io/home-assistant/home-assistant:stable"
    homeassistant_port: 8123
    homeassistant_timezone: "America/Los_Angeles"

  tasks:
    - name: Ensure Home Assistant config directory exists
      ansible.builtin.file:
        path: "{{ compose_base }}/homeassistant/config"
        state: directory
        mode: '0755'
      become: yes
      tags: [docker, homeassistant, configure]

    - name: Deploy Home Assistant compose file from template
      ansible.builtin.template:
        src: "../templates/homeassistant-compose.yml.j2"
        dest: "{{ compose_base }}/homeassistant/docker-compose.yml"
        mode: '0644'
      become: yes
      tags: [docker, homeassistant, configure]

    - name: Allow Home Assistant API port from the Docker bridge network
      community.general.ufw:
        rule: allow
        port: "{{ homeassistant_port }}"
        proto: tcp
        src: "{{ docker_network_subnet }}"
      vars:
        docker_network_subnet: "172.18.0.0/16"
      become: yes
      tags: [docker, homeassistant, security]

    - name: Start Home Assistant
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/homeassistant"
        state: present
      become: yes
      tags: [docker, homeassistant, service]

    - name: Wait for Home Assistant to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ homeassistant_port }}"
        status_code: [200, 302, 401]
        timeout: 5
      register: ha_health
      until: ha_health.status in [200, 302, 401]
      retries: 24
      delay: 5
      when: not ansible_check_mode
      tags: [docker, homeassistant, service]

    # Superseded by the .storage/http task below (HA 2026.8 ignores this
    # YAML key entirely, even on a fresh install) — kept only so a prior
    # apply of this playbook is cleaned up idempotently.
    - name: Remove ineffective HTTP proxy-trust block from configuration.yaml
      ansible.builtin.blockinfile:
        path: "{{ compose_base }}/homeassistant/config/configuration.yaml"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - trust local nginx reverse proxy"
        state: absent
      become: yes
      when: not ansible_check_mode
      tags: [docker, homeassistant, configure]

    # HA rejects requests carrying X-Forwarded-For from an untrusted proxy
    # with a 400 by default — required for the nginx vhost (playbooks/nginx.yml)
    # to reach it. As of HA 2026.8 this is NOT a configuration.yaml setting
    # any more (that key is parsed but silently ignored, even on a fresh
    # install with no legacy YAML to migrate) — it lives in the runtime
    # .storage/http file instead. We merge the two keys in with jq rather
    # than overwrite the file, since HA owns the rest of its fields
    # (created_at, ssl_profile, etc.) and the schema isn't ours to author.
    - name: Ensure Home Assistant HTTP storage trusts the local nginx proxy
      ansible.builtin.shell: |
        set -euo pipefail
        f="{{ compose_base }}/homeassistant/config/.storage/http"
        if jq -e '.data.stable.use_x_forwarded_for == true and .data.stable.trusted_proxies == ["127.0.0.1","::1"]' "$f" >/dev/null 2>&1; then
          exit 0
        fi
        tmp=$(mktemp)
        jq '.data.stable.use_x_forwarded_for = true | .data.stable.trusted_proxies = ["127.0.0.1","::1"]' "$f" > "$tmp"
        mv "$tmp" "$f"
        echo changed
      args:
        executable: /bin/bash
      register: ha_proxy_storage
      changed_when: "'changed' in ha_proxy_storage.stdout"
      become: yes
      when: not ansible_check_mode
      tags: [docker, homeassistant, configure]

    - name: Restart Home Assistant to apply proxy trust config
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/homeassistant"
        state: present
        recreate: always
      become: yes
      when: not ansible_check_mode and ha_proxy_storage.changed
      tags: [docker, homeassistant, service]
