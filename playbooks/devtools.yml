---
# Developer tooling: GitHub CLI, MCP Toolbox, Go + sonoscli, Java/Clojure, Elixir (asdf).
# Play 2 is the former elixir-dev.yml (Erlang compiles from source; first run 20-30 min).

- name: Developer tooling
  hosts: homelab
  gather_facts: yes

  tasks:
    - name: Add/refresh GitHub CLI apt repository key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: '0644'
        force: no            # key is stable; re-downloading every run reported a change each time
      become: yes
      tags: [install, github]

    - name: Add GitHub CLI apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        state: present
        filename: github-cli
      become: yes
      tags: [install, github]

    - name: Install GitHub CLI
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: yes
      become: yes
      tags: [install, github]

    - name: Install MCP Toolbox for Databases (genai-toolbox)
      ansible.builtin.get_url:
        url: "https://storage.googleapis.com/genai-toolbox/v0.31.0/linux/amd64/toolbox"
        dest: /usr/local/bin/toolbox
        mode: '0755'
        checksum: "sha256:f709e43f45b899a5c84abdfd1b2082ff5187c4d133c5a824c83411e2fc880e24"
      become: yes
      tags: [install, cockroachdb]

    - name: Install Go (required for sonoscli)
      ansible.builtin.apt:
        name: golang-go
        state: present
      become: yes
      tags: [install, sonos]

    - name: Install sonoscli
      ansible.builtin.shell:
        cmd: go install github.com/steipete/sonoscli/cmd/sonos@latest
        creates: /home/eslick/go/bin/sonos
      become: yes
      become_user: eslick
      environment:
        HOME: /home/eslick
        GOPATH: /home/eslick/go
      tags: [install, sonos]

    - name: Install OpenJDK 21 JRE
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present
        update_cache: no
      become: yes
      tags: [install, clojure, java]

    - name: Check whether Clojure CLI is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/clojure
      register: clojure_bin
      tags: [install, clojure]

    - name: Download Clojure Linux installer
      ansible.builtin.get_url:
        url: https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
        dest: /tmp/linux-install-clojure.sh
        mode: '0755'
      when: not clojure_bin.stat.exists
      tags: [install, clojure]

    - name: Install Clojure CLI
      ansible.builtin.command:
        cmd: bash /tmp/linux-install-clojure.sh
        creates: /usr/local/bin/clojure
      become: yes
      tags: [install, clojure]

# Installs Elixir/Erlang development tooling for the eslick user via asdf.
# Erlang is compiled from source — first run takes 20–30 minutes.
# Re-runs are fast: `creates:` guards skip already-installed versions.
#
# Apply:   ansible-playbook playbooks/devtools.yml --tags elixir
# Upgrade: bump erlang_version / elixir_version vars and re-run

- name: Install Elixir development environment
  hosts: homelab
  gather_facts: yes

  vars:
    dev_user: eslick
    asdf_dir: "/home/{{ dev_user }}/.asdf"
    asdf_sh: "/home/{{ dev_user }}/.asdf/asdf.sh"
    # OTP version (asdf-erlang uses Erlang/OTP release numbering)
    erlang_version: "28.2"
    # asdf-elixir appends -otp-NN to match OTP major version
    elixir_version: "1.19.5-otp-28"

  tasks:
    # --- Build dependencies ---

    - name: Install Erlang build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - autoconf
          - m4
          - libncurses-dev
          - libssl-dev
          - libssh-dev
          - inotify-tools   # Phoenix live reload
          - git
        state: present
        update_cache: yes
      become: yes
      tags: [install, deps]

    # --- asdf version manager ---

    - name: Clone asdf version manager
      ansible.builtin.git:
        repo: https://github.com/asdf-vm/asdf.git
        dest: "{{ asdf_dir }}"
        version: v0.16.7
        update: no
      become: yes
      become_user: "{{ dev_user }}"
      tags: [install, asdf]

    - name: Add asdf to .bashrc
      ansible.builtin.blockinfile:
        path: "/home/{{ dev_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - asdf"
        block: |
          export ASDF_DIR="$HOME/.asdf"
          . "$HOME/.asdf/asdf.sh"
      become: yes
      become_user: "{{ dev_user }}"
      tags: [configure, asdf]

    # --- Erlang ---

    - name: Add asdf-erlang plugin
      ansible.builtin.command:
        cmd: >
          bash -c ". {{ asdf_sh }} &&
          asdf plugin add erlang https://github.com/asdf-vm/asdf-erlang.git"
      become: yes
      become_user: "{{ dev_user }}"
      register: erlang_plugin
      changed_when: "'already added' not in erlang_plugin.stderr"
      failed_when: erlang_plugin.rc != 0 and 'already added' not in erlang_plugin.stderr
      tags: [install, erlang]

    - name: Install Erlang/OTP {{ erlang_version }} (compiles from source, ~20 min first run)
      ansible.builtin.command:
        # --without-wx: headless server, no GUI toolkit needed
        # --without-javac: no Java interop needed
        cmd: >
          bash -c ". {{ asdf_sh }} &&
          KERL_CONFIGURE_OPTIONS='--without-javac --without-wx'
          asdf install erlang {{ erlang_version }}"
        creates: "{{ asdf_dir }}/installs/erlang/{{ erlang_version }}"
      become: yes
      become_user: "{{ dev_user }}"
      tags: [install, erlang]
      when: not ansible_check_mode

    - name: Set global Erlang version to {{ erlang_version }}
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && asdf global erlang {{ erlang_version }}"
      become: yes
      become_user: "{{ dev_user }}"
      changed_when: false
      tags: [configure, erlang]

    # --- Elixir ---

    - name: Add asdf-elixir plugin
      ansible.builtin.command:
        cmd: >
          bash -c ". {{ asdf_sh }} &&
          asdf plugin add elixir https://github.com/asdf-vm/asdf-elixir.git"
      become: yes
      become_user: "{{ dev_user }}"
      register: elixir_plugin
      changed_when: "'already added' not in elixir_plugin.stderr"
      failed_when: elixir_plugin.rc != 0 and 'already added' not in elixir_plugin.stderr
      tags: [install, elixir]

    - name: Install Elixir {{ elixir_version }}
      ansible.builtin.command:
        cmd: >
          bash -c ". {{ asdf_sh }} &&
          asdf install elixir {{ elixir_version }}"
        creates: "{{ asdf_dir }}/installs/elixir/{{ elixir_version }}"
      become: yes
      become_user: "{{ dev_user }}"
      tags: [install, elixir]

    - name: Set global Elixir version to {{ elixir_version }}
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && asdf global elixir {{ elixir_version }}"
      become: yes
      become_user: "{{ dev_user }}"
      changed_when: false
      tags: [configure, elixir]

    # --- Mix tooling ---

    - name: Install Hex package manager
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && mix local.hex --force"
      become: yes
      become_user: "{{ dev_user }}"
      changed_when: false
      tags: [install, elixir]

    - name: Install rebar3
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && mix local.rebar --force"
      become: yes
      become_user: "{{ dev_user }}"
      changed_when: false
      tags: [install, elixir]

    - name: Reshim asdf after mix tooling install
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && asdf reshim elixir"
      become: yes
      become_user: "{{ dev_user }}"
      changed_when: false
      tags: [install, elixir]

    # --- Verify ---

    - name: Verify elixir and mix are accessible
      ansible.builtin.command:
        cmd: bash -c ". {{ asdf_sh }} && elixir --version && mix --version"
      become: yes
      become_user: "{{ dev_user }}"
      register: elixir_version_check
      changed_when: false
      tags: [verify]

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ elixir_version_check.stdout_lines }}"
      tags: [verify]
