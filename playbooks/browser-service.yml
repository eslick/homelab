---
# Headless Chromium session service for Arcana and Claude (via MCP). Source: projects/browser-service.
#
# Usage:
#   ansible-playbook playbooks/browser-service.yml --check --diff
#   ansible-playbook playbooks/browser-service.yml                              # up (rebuilds on source change)
#   ansible-playbook playbooks/browser-service.yml --tags sites                 # only re-render site credentials
#   ansible-playbook playbooks/browser-service.yml -e browser_service_state=absent   # down; keeps the data volume
#
# Adding a site Arcana may log in to: add its vault vars to group_vars/all.yml (ansible-vault edit),
# add an entry to browser_sites below, run with --tags sites. See projects/browser-service/README.md.

- name: Manage the headless browser service
  hosts: homelab
  gather_facts: no
  vars_files:
    - ../vars/browser-service.yml

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net
    secrets_path: /opt/secrets
    browser_service_src: "{{ (playbook_dir ~ '/../projects/browser-service') | realpath }}"
    browser_service_state: present      # present | absent (absent keeps the browser-data volume)
    browser_service_max_sessions: 4
    browser_service_mem: 6g
    browser_service_cpus: 4
    browser_service_operator: eslick    # owns the token file so the operator can export it for MCP clients
    browser_service_timezone: America/Los_Angeles   # browser reports the operator's timezone/locale, not UTC
    browser_service_locale: en-US
    browser_service_uid: 1001           # pwuser inside the image; must be able to read the sites file

    browser_service_env:
      BROWSER_SERVICE_TOKEN: "{{ browser_service_token }}"
      DISCORD_WEBHOOK_URL: "{{ vault_browser_discord_webhook | default('') }}"   # not yet created
      DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token | default('') }}"
      DISCORD_USER_ID: "{{ vault_discord_user_id | default('') }}"               # not yet created

    # Containers the browser may reach on the private network (the things Arcana/Claude debug).
    # Everything else private (yugabytedb, minio, this API, the tailnet, metadata IPs) is blocked.
    browser_service_internal_hosts:
      - arcana-dev
      - arcana-dev-2

    # Profiles. `allowed_hosts` restricts top-level navigation; sessions on a profile with
    # credentials also have `evaluate` disabled unless allow_evaluate: true. Secrets come from the
    # vault via `default('')`, so a profile without its vault vars simply has no credentials.
    # Fields: label, login_url, allowed_hosts, username, password, totp_secret (base32),
    #   form{username,password,submit,totp}, steps[], verify{url, present|absent} (required with credentials),
    #   allow_internal[], allow_evaluate, identity{user_agent,locale,timezone}.
    browser_sites:
      # Credential-less profile for debugging Arcana's own admin console.
      arcana:
        label: Arcana admin console
        allowed_hosts: [arcana-dev, arcana-dev-2]
        allow_evaluate: true
      # Sign-in is done by the operator through the live view (Google SSO): the agent calls request_human,
      # you get a Discord link, sign in, press Done; cookies are saved to this profile. No stored credentials.
      # allowed_hosts must include every host top-level navigation passes through during sign-in
      # (a blocked one shows up in network_log as "not in profile allowed_hosts").
      perplexity:
        label: Perplexity (Google SSO, human-managed)
        allowed_hosts: [perplexity.ai, "*.perplexity.ai", accounts.google.com, "*.google.com", accounts.youtube.com]
        allow_evaluate: true
        verify:
          url: https://www.perplexity.ai/
          absent: "button:has-text('Sign in'), a:has-text('Sign in')"   # provisional; confirm on the live site
      # Template for a personal site (disabled until its vault vars exist):
      # example:
      #   label: Example
      #   login_url: https://example.com/login
      #   allowed_hosts: [example.com, "*.example.com"]
      #   username: "{{ vault_browser_example_user }}"
      #   password: "{{ vault_browser_example_password }}"
      #   totp_secret: "{{ vault_browser_example_totp | default('') }}"
      #   verify: { url: "https://example.com/account", present: "text=Sign out" }

  tasks:
    - name: Ensure browser-service compose directory exists
      ansible.builtin.file:
        path: "{{ compose_base }}/browser-service"
        state: directory
        mode: '0755'
      become: yes
      tags: [docker, configure]

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ secrets_path }}"
        state: directory
      become: yes
      tags: [docker, configure, security, sites]

    # Discord notifies the operator when a session needs a human (live-view link): a channel webhook
    # (vault_browser_discord_webhook) and/or a DM from the bot (vault_discord_user_id). With neither the
    # service skips the message and returns the link to the caller instead.
    - name: Deploy browser-service env file (API token, Discord; 0600, blanks skipped)
      ansible.builtin.copy:
        dest: "{{ secrets_path }}/browser-service.env"
        owner: "{{ browser_service_operator }}"
        group: "{{ browser_service_operator }}"
        mode: '0600'
        content: "{% for i in browser_service_env | dict2items if (i.value | string | trim) != '' %}{{ i.key }}={{ i.value }}\n{% endfor %}"
      no_log: true
      become: yes
      tags: [docker, configure, security]

    # Rendered with `default` filters already applied; profiles whose vault vars are missing fail
    # loudly (undefined variable) rather than shipping empty credentials.
    - name: Deploy browser-service site/profile definitions (readable only by the container user)
      ansible.builtin.copy:
        dest: "{{ secrets_path }}/browser-sites.json"
        owner: "{{ browser_service_uid }}"
        group: "{{ browser_service_uid }}"
        mode: '0400'
        content: "{{ {'sites': browser_sites} | to_nice_json }}\n"
      no_log: true
      become: yes
      notify: Restart browser-service
      tags: [docker, configure, security, sites]

    - name: Deploy browser-service compose file from template
      ansible.builtin.template:
        src: ../templates/browser-service-compose.yml.j2
        dest: "{{ compose_base }}/browser-service/docker-compose.yml"
        mode: '0644'
      become: yes
      tags: [docker, configure]

    - name: Build and start browser-service
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/browser-service"
        state: "{{ browser_service_state }}"
        build: always
      become: yes
      when: not ansible_check_mode
      tags: [docker, service]

    - name: Wait for browser-service to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ browser_service_port }}/healthz"
        timeout: 5
      register: browser_health
      until: browser_health.status == 200
      retries: 12
      delay: 5
      when: not ansible_check_mode and browser_service_state == 'present'
      tags: [docker, service]

  handlers:
    - name: Restart browser-service
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/browser-service"
        state: restarted
      become: yes
      when: not ansible_check_mode and browser_service_state == 'present'
