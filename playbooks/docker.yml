---
# Manages all Docker Compose services.
# Add new containers by:
#   1. Adding an entry to the `services` var
#   2. Creating a template in templates/<service>-compose.yml.j2
#   3. Running: ansible-playbook playbooks/docker.yml --check --diff
#   4. Applying: ansible-playbook playbooks/docker.yml

- name: Manage Docker Compose services
  hosts: homelab
  gather_facts: no

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net

    services:
      - name: cockroachdb
        ports: [26257]  # UI port 8090 is 127.0.0.1-bound; nginx handles external access
      - name: minio
        ports: [9000]  # console port 9001 is 127.0.0.1-bound; nginx handles external access
      - name: yugabytedb
        ports: [5433]  # UI port 7000 is 127.0.0.1-bound; nginx handles external access
      - name: datomic
        ports: [4334]
      - name: arcana
        ports: []  # 127.0.0.1-bound; nginx handles external access via port 14000
      - name: homedev
        ports: []  # host networking; nREPL :7888 is localhost-only; nginx fronts web UI on :3001

    # Admin console ports that are 127.0.0.1-bound in their compose files
    # (not in the `services[].ports` blanket-UFW-allow above) and instead
    # get scoped UFW rules below + an nginx TLS vhost (playbooks/nginx.yml).
    admin_console_ports:
      - "{{ cockroachdb_ui_port }}"
      - "{{ minio_console_port }}"
      - "{{ yugabytedb_ui_port }}"

    # Obsidian vault (synced via Syncthing — no secrets here)
    vault_path: /opt/vaults/obsidian
    # Secrets store (not synced — credentials, tokens)
    secrets_path: /opt/secrets
    tailscale_hostname: speedracer.terrier-haddock.ts.net

    # CockroachDB (Datomic backend)
    cockroachdb_sql_port: 26257
    cockroachdb_ui_port: 8090

    # YugabyteDB (Arcana backend)
    yugabytedb_ysql_port: 5433
    yugabytedb_ui_port: 7000
    # Pinned container hostname -- yugabyted's persisted catalog already
    # references this value from its original bootstrap; do not change it
    # (see the comment in templates/yugabytedb-compose.yml.j2).
    yugabytedb_hostname: "0121ceda213f"

    # MinIO
    minio_api_port: 9000
    minio_console_port: 9001
    minio_root_user: minioadmin
    minio_root_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') | default('changeme', true) }}"

    # Datomic Transactor
    datomic_port: 4334
    datomic_version: "1.0.7556"

    # Arcana BEAM cluster
    arcana_src_path: /home/eslick/homelab/projects/arcana
    arcana_beam1_port: 14100
    arcana_beam2_port: 14101
    arcana_port: 14000
    arcana_cookie: "arcana_dev"
    arcana_cluster_nodes: 1  # set to 2 to re-enable beam-2 for cluster testing
    anthropic_api_key: "{{ vault_anthropic_api_key }}"
    openai_api_key: "{{ vault_openai_api_key }}"

  tasks:
    # --- Shared infrastructure ---

    - name: Create shared Docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"
      become: yes
      tags: [docker]

    - name: Ensure compose directories exist
      ansible.builtin.file:
        path: "{{ compose_base }}/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ services }}"
      become: yes
      tags: [docker]

    - name: Deploy compose files from templates
      ansible.builtin.template:
        src: "../templates/{{ item.name }}-compose.yml.j2"
        dest: "{{ compose_base }}/{{ item.name }}/docker-compose.yml"
        mode: '0644'
      loop: "{{ services | selectattr('managed', 'undefined') | list + services | selectattr('managed', 'defined') | selectattr('managed') | list }}"
      become: yes
      tags: [docker, configure]

    - name: Allow service ports through UFW
      community.general.ufw:
        rule: allow
        port: '{{ item.1 }}'
        proto: tcp
      loop: "{{ services | subelements('ports') }}"
      become: yes
      tags: [docker, security]

    # These ports used to be in `services[].ports` above (open to Anywhere),
    # but are now 127.0.0.1-bound in their compose files and fronted by an
    # nginx TLS vhost on the Tailscale IP instead (playbooks/nginx.yml).
    - name: Remove blanket UFW allow for admin console ports
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
        delete: yes
      loop: "{{ admin_console_ports }}"
      become: yes
      tags: [docker, security]

    - name: Allow admin console ports from localhost only (nginx proxies from here)
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
        src: 127.0.0.1
      loop: "{{ admin_console_ports }}"
      become: yes
      tags: [docker, security]

    # --- CockroachDB (must start first, Datomic depends on it) ---

    - name: Start CockroachDB
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/cockroachdb"
        state: present
      become: yes
      tags: [docker, service]

    - name: Wait for CockroachDB to accept connections
      ansible.builtin.command: >
        docker exec cockroachdb
        cockroach sql --insecure -e "SELECT 1"
      register: crdb_ready
      until: crdb_ready.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      become: yes
      tags: [docker]

    - name: Create Datomic database in CockroachDB
      ansible.builtin.command: >
        docker exec cockroachdb
        cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS datomic"
      register: crdb_create_db
      changed_when: "'CREATE DATABASE' in crdb_create_db.stdout"
      become: yes
      tags: [docker]

    - name: Create datomic_kvs table in CockroachDB
      ansible.builtin.shell: >
        docker exec cockroachdb cockroach sql --insecure -d datomic -e "
        CREATE TABLE IF NOT EXISTS datomic_kvs (
          id TEXT NOT NULL,
          rev INTEGER,
          map TEXT,
          val BYTES,
          CONSTRAINT pk_id PRIMARY KEY (id)
        );
        GRANT ALL ON TABLE datomic_kvs TO public;"
      register: crdb_table
      changed_when: "'CREATE TABLE' in crdb_table.stdout"
      become: yes
      tags: [docker]

    # --- YugabyteDB (Arcana backend) ---

    - name: Start YugabyteDB
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/yugabytedb"
        state: present
      become: yes
      tags: [docker, service]

    - name: Wait for YugabyteDB YSQL to accept connections
      ansible.builtin.command: >
        docker exec yugabytedb
        ysqlsh -h yugabytedb -U yugabyte -c "SELECT 1"
      register: yugabyte_ready
      until: yugabyte_ready.rc == 0
      retries: 20
      delay: 5
      changed_when: false
      become: yes
      tags: [docker]

    # --- MinIO ---

    - name: Start MinIO
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/minio"
        state: present
      become: yes
      tags: [docker, service]

    # --- Arcana BEAM cluster ---

    - name: Ensure arcana compose directory exists
      ansible.builtin.file:
        path: "{{ compose_base }}/arcana"
        state: directory
        mode: '0755'
      become: yes
      tags: [arcana, configure]

    - name: Deploy arcana compose file from template
      ansible.builtin.template:
        src: "../templates/arcana-compose.yml.j2"
        dest: "{{ compose_base }}/arcana/docker-compose.yml"
        mode: '0644'
      become: yes
      tags: [arcana, configure]

    - name: Create agent_os_dev database in YugabyteDB
      ansible.builtin.command: >
        docker exec yugabytedb
        ysqlsh -h yugabytedb -U yugabyte -c "CREATE DATABASE agent_os_dev"
      register: arcana_yuga_db
      changed_when: "'CREATE DATABASE' in arcana_yuga_db.stdout"
      failed_when: >
        arcana_yuga_db.rc != 0 and
        'already exists' not in arcana_yuga_db.stderr
      become: yes
      tags: [arcana]

    - name: Create Arcana artifacts bucket in MinIO
      ansible.builtin.command: >
        docker run --rm --network {{ docker_network }} --entrypoint sh minio/mc -c "
          mc alias set local http://minio:9000 {{ minio_root_user }} {{ minio_root_password }} &&
          mc mb --ignore-existing local/artifacts"
      register: arcana_bucket
      changed_when: "'Bucket created' in arcana_bucket.stdout"
      become: yes
      tags: [arcana]

    - name: Build Arcana dev image
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_base }}/arcana/docker-compose.yml
          build beam-1
      become: yes
      register: arcana_build
      changed_when: "'writing image' in arcana_build.stdout"
      tags: [arcana, service]

    - name: Run Arcana migrations and seeds (one-off container, before starting servers)
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_base }}/arcana/docker-compose.yml
          run --rm beam-1 sh -c "mix ecto.migrate && mix run priv/repo/seeds.exs"
      become: yes
      register: arcana_migrate
      changed_when: "'Migrated' in arcana_migrate.stderr or 'Created' in arcana_migrate.stdout"
      # CockroachDB DDL auto-commits mid-transaction; Ecto's rollback handler
      # panics with rc=1 even when all migrations succeeded. Treat rc=1 with
      # the known MatchError as a warning, not a hard failure.
      failed_when: >
        arcana_migrate.rc not in [0, 1] or
        (arcana_migrate.rc == 1 and
         'MatchError' not in arcana_migrate.stderr and
         'TransactionError' not in arcana_migrate.stderr)
      when: not ansible_check_mode
      tags: [arcana, service]

    - name: Start beam-1
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_base }}/arcana/docker-compose.yml
          up -d --no-deps beam-1
      become: yes
      register: arcana_beam1_up
      changed_when: "'Started' in arcana_beam1_up.stdout or 'Created' in arcana_beam1_up.stdout"
      tags: [arcana, service]

    - name: Wait for beam-1 Phoenix endpoint to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ arcana_beam1_port }}"
        status_code: [200, 301, 302, 303]
        timeout: 5
      register: arcana_beam1_health
      until: arcana_beam1_health.status in [200, 301, 302, 303]
      retries: 24
      delay: 5
      when: not ansible_check_mode
      tags: [arcana, service]

    - name: Start beam-2 (reuses compiled deps/build volumes)
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_base }}/arcana/docker-compose.yml
          up -d --no-deps beam-2
      become: yes
      register: arcana_beam2_up
      changed_when: "'Started' in arcana_beam2_up.stdout or 'Created' in arcana_beam2_up.stdout"
      when: arcana_cluster_nodes | int >= 2
      tags: [arcana, service]

    - name: Stop beam-2 when running single-node
      ansible.builtin.command:
        cmd: >
          docker compose -f {{ compose_base }}/arcana/docker-compose.yml
          stop beam-2
      become: yes
      register: arcana_beam2_stop
      changed_when: "'Stopped' in arcana_beam2_stop.stderr"
      failed_when: false
      when: arcana_cluster_nodes | int < 2
      tags: [arcana, service]

    # --- Datomic Transactor ---

    - name: Deploy Datomic Dockerfile
      ansible.builtin.template:
        src: "../templates/datomic-Dockerfile.j2"
        dest: "{{ compose_base }}/datomic/Dockerfile"
        mode: '0644'
      become: yes
      tags: [docker, configure]

    - name: Deploy Datomic transactor properties
      ansible.builtin.template:
        src: "../templates/datomic-transactor.properties.j2"
        dest: "{{ compose_base }}/datomic/transactor.properties"
        mode: '0640'
      become: yes
      tags: [docker, configure]

    - name: Build and start Datomic transactor
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/datomic"
        state: present
        build: always
      become: yes
      tags: [docker, service]

    # --- homedev Clojure orchestrator ---

    - name: Ensure homedev compose directory exists
      ansible.builtin.file:
        path: "{{ compose_base }}/homedev"
        state: directory
        mode: '0755'
      become: yes
      tags: [homedev, configure]

    - name: Deploy homedev compose file from template
      ansible.builtin.template:
        src: "../templates/homedev-compose.yml.j2"
        dest: "{{ compose_base }}/homedev/docker-compose.yml"
        mode: '0644'
      become: yes
      tags: [homedev, configure]

    - name: Build and start homedev
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/homedev"
        build: always
        state: present
      become: yes
      tags: [homedev, service]

    - name: Create homedev database in CockroachDB
      ansible.builtin.command: >
        docker exec cockroachdb
        cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS homedev"
      register: homedev_db
      changed_when: "'CREATE DATABASE' in homedev_db.stdout"
      become: yes
      tags: [homedev]

    - name: Create homedev bucket in MinIO
      ansible.builtin.command: >
        docker run --rm --network {{ docker_network }} --entrypoint sh minio/mc -c "
          mc alias set local http://minio:9000 {{ minio_root_user }} {{ minio_root_password }} &&
          mc mb --ignore-existing local/homedev"
      register: homedev_bucket
      changed_when: "'Bucket created' in homedev_bucket.stdout"
      become: yes
      tags: [homedev]

    # --- OpenClaw Gateway (removed) ---

    - name: Stop and remove openclaw container (keep data volume)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/openclaw"
        state: absent
        remove_volumes: false
      become: yes
      failed_when: false
      tags: [openclaw, cleanup]

    - name: Remove openclaw compose directory
      ansible.builtin.file:
        path: "{{ compose_base }}/openclaw"
        state: absent
      become: yes
      tags: [openclaw, cleanup]

    - name: Remove openclaw model cache directory
      ansible.builtin.file:
        path: /opt/cache/openclaw
        state: absent
      become: yes
      tags: [openclaw, cleanup]

    - name: Remove UFW allow rule for openclaw gateway port
      community.general.ufw:
        rule: allow
        port: '18789'
        proto: tcp
        delete: yes
      become: yes
      tags: [openclaw, cleanup, security]

    - name: Remove UFW allow rule for openclaw manifest port
      community.general.ufw:
        rule: allow
        port: '2099'
        proto: tcp
        delete: yes
      become: yes
      tags: [openclaw, cleanup, security]
