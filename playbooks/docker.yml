---
# Manages all Docker Compose services.
# Add new containers by:
#   1. Adding an entry to the `services` var
#   2. Creating a template in templates/<service>-compose.yml.j2
#   3. Running: ansible-playbook playbooks/docker.yml --check --diff
#   4. Applying: ansible-playbook playbooks/docker.yml

- name: Manage Docker Compose services
  hosts: homelab
  gather_facts: no

  vars:
    compose_base: /opt/compose
    docker_network: homelab-net

    services:
      - name: minio
        ports: []  # API :9000 and console :9001 are 127.0.0.1-bound; nginx handles tailnet access
      - name: yugabytedb
        ports: []  # YSQL :5433 and UI :7000 are 127.0.0.1-bound (containers use homelab-net); nginx handles UI access

    # Admin console ports that are 127.0.0.1-bound in their compose files
    # (not in the `services[].ports` blanket-UFW-allow above) and instead
    # get scoped UFW rules below + an nginx TLS vhost (playbooks/nginx.yml).
    admin_console_ports: >-
      {{ [minio_api_port, minio_console_port]
         + ([yugabytedb_ui_port] if yugabytedb_enabled | bool else []) }}

    # Obsidian vault (synced via Syncthing — no secrets here)
    vault_path: /opt/vaults/obsidian
    # Secrets store (not synced — credentials, tokens)
    secrets_path: /opt/secrets
    tailscale_hostname: speedracer.terrier-haddock.ts.net

    # YugabyteDB (the single SQL database; Arcana 2 creates its own arcana_dev)
    yugabytedb_ysql_port: 5433
    yugabytedb_ui_port: 7000
    # Pinned to the 2025.2 stable series; `latest` now points at 2026.1.x.
    yugabytedb_version: "2025.2.6.0-b111"
    # When false, the container is removed but the yugabyte-data volume, compose
    # file and template are kept.
    yugabytedb_enabled: true
    # Pinned container hostname -- yugabyted's persisted catalog already
    # references this value from its original bootstrap; do not change it
    # (see the comment in templates/yugabytedb-compose.yml.j2).
    yugabytedb_hostname: "0121ceda213f"

    # MinIO
    # Built from upstream source (no published images any more). 2025-10-15 is
    # the newest upstream release; it fixes CVE-2025-62506 (present in 2025-09-07).
    minio_version: "RELEASE.2025-10-15T17-29-55Z"
    minio_api_port: 9000
    minio_console_port: 9001
    # Root credentials: the password is read from the operator's file at deploy time (never
    # committed) and written only to a root-only env file; there is no fallback default.
    minio_root_user: admin
    minio_root_password: "{{ lookup('ansible.builtin.file', '~/.ssh/internal-default.txt') | trim }}"

  tasks:
    # --- Shared infrastructure ---

    - name: Create shared Docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"
      become: yes
      tags: [docker]

    - name: Ensure compose directories exist
      ansible.builtin.file:
        path: "{{ compose_base }}/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ services }}"
      become: yes
      tags: [docker]

    - name: Deploy compose files from templates
      ansible.builtin.template:
        src: "../templates/{{ item.name }}-compose.yml.j2"
        dest: "{{ compose_base }}/{{ item.name }}/docker-compose.yml"
        mode: '0644'
      loop: "{{ services | selectattr('managed', 'undefined') | list + services | selectattr('managed', 'defined') | selectattr('managed') | list }}"
      become: yes
      tags: [docker, configure, minio]

    - name: Allow service ports through UFW
      community.general.ufw:
        rule: allow
        port: '{{ item.1 }}'
        proto: tcp
      loop: "{{ services | subelements('ports') }}"
      become: yes
      tags: [docker, security]

    # These ports used to be in `services[].ports` above (open to Anywhere),
    # but are now 127.0.0.1-bound in their compose files and fronted by an
    # nginx TLS vhost on the Tailscale IP instead (playbooks/nginx.yml).
    - name: Remove blanket UFW allow for admin console ports
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
        delete: yes
      loop: "{{ admin_console_ports }}"
      become: yes
      tags: [docker, security, minio]

    - name: Allow admin console ports from localhost only (nginx proxies from here)
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
        src: 127.0.0.1
      loop: "{{ admin_console_ports }}"
      become: yes
      tags: [docker, security, minio]

    # YSQL (auth disabled) is loopback-only; never open it in the firewall.
    - name: Ensure no UFW allow for the YugabyteDB YSQL port
      community.general.ufw:
        rule: allow
        port: '{{ yugabytedb_ysql_port }}'
        proto: tcp
        delete: yes
      become: yes
      tags: [docker, security]

    - name: Remove UFW localhost rule for the YugabyteDB UI port while disabled
      community.general.ufw:
        rule: allow
        port: '{{ yugabytedb_ui_port }}'
        proto: tcp
        src: 127.0.0.1
        delete: yes
      when: not (yugabytedb_enabled | bool)
      become: yes
      tags: [docker, security]

    # --- YugabyteDB (single SQL database; Arcana 2) ---

    # `state: absent` errors when nothing exists to remove, so only reconcile
    # when enabled or when a leftover container is still present.
    - name: Check for existing YugabyteDB container
      ansible.builtin.command: docker ps -a --filter name=^yugabytedb$ --format '{% raw %}{{.Names}}{% endraw %}'
      register: yugabyte_existing
      changed_when: false
      check_mode: no
      become: yes
      tags: [docker, service]

    - name: Start or remove YugabyteDB per yugabytedb_enabled
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/yugabytedb"
        state: "{{ 'present' if yugabytedb_enabled | bool else 'absent' }}"
      when: yugabytedb_enabled | bool or yugabyte_existing.stdout | trim != ''
      become: yes
      tags: [docker, service]

    - name: Wait for YugabyteDB YSQL to accept connections
      ansible.builtin.command: >
        docker exec yugabytedb
        ysqlsh -h yugabytedb -U yugabyte -c "SELECT 1"
      register: yugabyte_ready
      until: yugabyte_ready.rc == 0
      retries: 36
      delay: 5
      changed_when: false
      when: yugabytedb_enabled | bool
      become: yes
      tags: [docker]

    # --- MinIO ---

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ secrets_path }}"
        state: directory
      become: yes
      tags: [docker, configure, security, minio]

    # Keep the last published image (2025-09-07) under a stable local name for
    # rollback; it can no longer be re-pulled.
    - name: Preserve legacy MinIO image for rollback
      community.docker.docker_image:
        name: minio/minio:latest
        repository: minio-legacy
        tag: "2025-09-07"
        source: local
      become: yes
      failed_when: false
      tags: [docker, service]

    - name: Deploy MinIO root credentials env file (root-only)
      ansible.builtin.copy:
        dest: "{{ secrets_path }}/minio.env"
        owner: root
        group: root
        mode: '0600'
        content: |
          MINIO_ROOT_USER={{ minio_root_user }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
      no_log: true
      become: yes
      tags: [docker, configure, security, minio]

    - name: Deploy MinIO Dockerfile
      ansible.builtin.template:
        src: "../templates/minio-Dockerfile.j2"
        dest: "{{ compose_base }}/minio/Dockerfile"
        mode: '0644'
      become: yes
      tags: [docker, configure, minio]

    - name: Build and start MinIO
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/minio"
        state: present
        build: always
      become: yes
      tags: [docker, service, minio]

    # One-off: a throwaway connectivity test pulled this image; it is not part of any stack.
    - name: Remove stray curlimages/curl test image
      community.docker.docker_image:
        name: curlimages/curl
        tag: latest
        state: absent
      become: yes
      tags: [docker, cleanup, curl-image]

    # --- OpenClaw Gateway (removed) ---

    - name: Stop and remove openclaw container (keep data volume)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_base }}/openclaw"
        state: absent
        remove_volumes: false
      become: yes
      failed_when: false
      tags: [openclaw, cleanup]

    - name: Remove openclaw compose directory
      ansible.builtin.file:
        path: "{{ compose_base }}/openclaw"
        state: absent
      become: yes
      tags: [openclaw, cleanup]

    - name: Remove openclaw model cache directory
      ansible.builtin.file:
        path: /opt/cache/openclaw
        state: absent
      become: yes
      tags: [openclaw, cleanup]

    - name: Remove UFW allow rule for openclaw gateway port
      community.general.ufw:
        rule: allow
        port: '18789'
        proto: tcp
        delete: yes
      become: yes
      tags: [openclaw, cleanup, security]

    - name: Remove UFW allow rule for openclaw manifest port
      community.general.ufw:
        rule: allow
        port: '2099'
        proto: tcp
        delete: yes
      become: yes
      tags: [openclaw, cleanup, security]
